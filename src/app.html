<title>ブラウザ統計ラボ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* レイアウト: 上にデータ形式タブ、左にデータシート、右に解析パネルと結果ツリー（スマホでは縦積み） */
:root {
  --bg: #eef1f0;          /* 方眼紙のようなわずかに緑がかったグレー */
  --sheet: #ffffff;
  --panel: #f7f9f8;
  --line: #cfd8d5;
  --grid: #e3e9e7;
  --fg: #1b2624;
  --muted: #5b6b67;
  --accent: #17607a;      /* ペトロールブルー */
  --accent-soft: #dcecf1;
  --sig: #a3480f;         /* 有意の印 */
  --sig-soft: #fbe9dc;
  --g1: #17607a; --g2: #c0612b; --g3: #5d7f2a; --g4: #7b4f9e; --g5: #b23a56; --g6: #3e7d78;
  --f-ui: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141b1a; --sheet: #1b2422; --panel: #18201f; --line: #33423f; --grid: #26312f; --fg: #e3ebe9; --muted: #95a6a2;
  --accent: #5fb6d3; --accent-soft: #1d3a44; --sig: #f0a06a; --sig-soft: #3d2718;
  --g1: #5fb6d3; --g2: #e8925c; --g3: #9cc25e; --g4: #b593d6; --g5: #e77894; --g6: #6fc2bb; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141b1a; --sheet: #1b2422; --panel: #18201f; --line: #33423f; --grid: #26312f; --fg: #e3ebe9; --muted: #95a6a2;
  --accent: #5fb6d3; --accent-soft: #1d3a44; --sig: #f0a06a; --sig-soft: #3d2718;
  --g1: #5fb6d3; --g2: #e8925c; --g3: #9cc25e; --g4: #b593d6; --g5: #e77894; --g6: #6fc2bb; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; line-height: 1.55; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
header.top h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
header.top h1 span { color: var(--accent); }
header.top p { margin: 0; color: var(--muted); font-size: 13px; }
nav.formats { display: flex; flex-wrap: wrap; gap: 6px; }
nav.formats button { font: inherit; border: 1px solid var(--line); background: var(--sheet); color: var(--fg); padding: 7px 12px; border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 0; line-height: 1.3; }
nav.formats button small { color: var(--muted); font-size: 11px; }
nav.formats button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
nav.formats button[aria-selected="true"] small { color: var(--sheet); opacity: .85; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.main { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
section.box { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.box > .hd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.box > .hd h2 { font-size: 14px; margin: 0; margin-right: auto; }
.box > .bd { padding: 10px 12px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.btn { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 4px 10px; border-radius: 4px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--sheet); border-color: var(--accent); }
.btn.run { text-align: left; padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; }
.btn.run b { font-weight: 500; font-size: 13px; }
.btn.run span { color: var(--muted); font-size: 11.5px; }

/* データシート */
.sheetwrap { overflow: auto; max-height: 62vh; border: 1px solid var(--line); border-radius: 4px; }
table.sheet { border-collapse: collapse; font-family: var(--f-num); font-size: 13px; }
table.sheet th, table.sheet td { border: 1px solid var(--grid); padding: 0; }
table.sheet thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
table.sheet .rn { background: var(--panel); color: var(--muted); font-size: 11px; text-align: right; padding: 0 6px; min-width: 34px; position: sticky; left: 0; }
table.sheet input.cell { width: 88px; border: 0; background: transparent; color: var(--fg); font: inherit; padding: 4px 6px; text-align: right; }
table.sheet input.cell.bad { background: var(--sig-soft); }
table.sheet input.name { width: 88px; border: 0; background: transparent; color: var(--fg); font-family: var(--f-ui); font-weight: 500; font-size: 12.5px; padding: 4px 6px; }
table.sheet input.rname { width: 96px; text-align: left; font-family: var(--f-ui); }
table.sheet .colhd { display: flex; align-items: center; gap: 2px; padding-left: 4px; }
table.sheet .colhd input[type=checkbox] { accent-color: var(--accent); margin: 0; }
table.sheet .total { color: var(--muted); padding: 4px 6px; text-align: right; }
.sheettools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* 解析パネル */
.runs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.opts label { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; } .opts select { max-width: 100%; }
.opts input { accent-color: var(--accent); }
.msg { margin-top: 8px; font-size: 12.5px; color: var(--sig); min-height: 1em; }

/* 結果 */
.toc { display: flex; flex-wrap: wrap; gap: 4px; }
.toc a { font-size: 12px; color: var(--accent); text-decoration: none; border: 1px solid var(--line); padding: 2px 8px; border-radius: 10px; background: var(--panel); }
.results { display: flex; flex-direction: column; gap: 12px; }
article.res { border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); min-width: 0; scroll-margin-top: 12px; }
article.res > header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--grid); background: var(--panel); border-radius: 6px 6px 0 0; flex-wrap: wrap; }
article.res > header h3 { font-size: 13.5px; margin: 0; margin-right: auto; }
article.res > header .meta { color: var(--muted); font-size: 11.5px; font-family: var(--f-num); }
article.res .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.res h4 { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); font-weight: 500; letter-spacing: .03em; }
.tw { overflow-x: auto; }
table.out { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.out th, table.out td { padding: 3px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.out thead th { border-bottom: 1px solid var(--fg); font-weight: 500; text-align: right; color: var(--muted); }
table.out thead th:first-child { text-align: left; }
table.out td { text-align: right; font-family: var(--f-num); }
table.out td:first-child, table.out td.l { text-align: left; font-family: var(--f-ui); }
table.out tbody tr:last-child td { border-bottom: 1px solid var(--fg); }
td.sig { color: var(--sig); font-weight: 500; }
td.hi { background: var(--sig-soft); }
.apa { font-size: 12.5px; background: var(--accent-soft); border-radius: 4px; padding: 6px 10px; }
.apa b { font-weight: 500; color: var(--accent); margin-right: 6px; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.warn { font-size: 12px; color: var(--sig); margin: 0; }
svg.chart { width: 100%; max-width: 640px; height: auto; display: block; }
svg.chart text { font-family: var(--f-ui); font-size: 11px; fill: var(--muted); }
.empty { color: var(--muted); font-size: 13px; padding: 20px 4px; text-align: center; }

/* 確率計算 */
.dist { display: flex; flex-direction: column; gap: 12px; }
.distform { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.distform label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
.distform input, .distform select { font: inherit; font-family: var(--f-num); padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); color: var(--fg); width: 110px; }
.distform select { font-family: var(--f-ui); width: auto; }
.bigres { font-family: var(--f-num); font-size: 18px; }
.bigres small { font-family: var(--f-ui); font-size: 12px; color: var(--muted); }
/* データベース型・図 */
.tbadge { font-family: var(--f-ui); font-size: 10px; border-radius: 3px; padding: 0 4px; line-height: 16px; color: var(--sheet); background: var(--muted); }
.tbadge.num { background: var(--accent); } .tbadge.cat { background: var(--g2); }
.autoh { margin: 14px 0 6px; font-size: 13px; } .autoh span { font-weight: 400; color: var(--muted); font-size: 11.5px; margin-left: 6px; }
.auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.minifig { margin: 0; border: 1px solid var(--grid); border-radius: 4px; padding: 4px 6px; background: var(--panel); min-width: 0; }
.minifig figcaption { font-size: 12px; font-weight: 500; }
svg.mini { width: 100%; height: auto; display: block; } svg.mini text { font-family: var(--f-num); font-size: 9.5px; fill: var(--muted); }
.roles { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.roles label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
.roles select, .opts select { font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); color: var(--fg); }
.dual { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; margin-top: 8px; }
.dlcol { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); overflow: hidden; }
.dlhead { padding: 6px 8px; font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; background: var(--panel); }
.dlhead small { font-weight: 400; color: var(--muted); }
.dlfilter { font: inherit; font-weight: 400; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
.dlist { height: 280px; overflow: auto; user-select: none; -webkit-user-select: none; }
.dli { padding: 5px 8px; border-bottom: 1px solid var(--grid); cursor: pointer; font-size: 12.5px; line-height: 1.35; }
.dli b { display: block; font-weight: 600; }
.dli span { display: block; color: var(--muted); font-size: 11.5px; }
.dli:hover { background: var(--accent-soft); }
.dli.on { background: var(--accent); color: #fff; }
.dli.on span { color: #fff; opacity: .9; }
.dual2 { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; margin-top: 6px; align-items: stretch; } .dual2 .dlbtns { justify-content: center; }
.corbox { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); } h4.corh { margin: 0 0 2px; font-size: 13px; } small.pp { color: var(--muted); font-size: 10.5px; }
@media (max-width: 640px) { .dual2 { grid-template-columns: 1fr !important; } .dual2 > * { grid-row: auto !important; grid-column: auto !important; } }
.dlbtns { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.dlbtns .btn { white-space: nowrap; padding: 4px 8px; }
.dlempty { padding: 14px 10px; color: var(--muted); font-size: 12px; }
@media (max-width: 640px) { .dual { grid-template-columns: 1fr; } .dlbtns { flex-direction: row; flex-wrap: wrap; } .dlist { height: 200px; } }
.chipset { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-top: 8px; font-size: 12.5px; }
.chipset > span { color: var(--muted); font-size: 12px; margin-right: 4px; }
details.cutlist { margin: 8px 0; font-size: 12.5px; } details.cutlist summary { cursor: pointer; color: var(--accent); margin-bottom: 6px; }
details.cutlist .tw { max-height: 320px; overflow: auto; }
.semfig { overflow-x: auto; } .semfig svg { min-width: 860px; width: 100%; height: auto; }
.semtoast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 80; background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 18px rgba(0,0,0,.18); padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; max-width: calc(100vw - 32px); flex-wrap: wrap; }
.semtoast[hidden] { display: none; } .semtoast progress { width: 180px; } .semtoast span { color: var(--muted); font-size: 12px; }
.semsum { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.semthumb { margin-top: 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); padding: 6px; cursor: pointer; max-height: 260px; overflow: hidden; }
.semthumb svg { width: 100%; height: auto; max-height: 246px; pointer-events: none; }
.semed { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
.semed[hidden] { display: none; }
.semhd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--sheet); }
.semhd label { display: flex; align-items: center; gap: 4px; }
.sembody { flex: 1; display: grid; grid-template-columns: 112px 1fr 250px; min-height: 0; }
.semtools { display: flex; flex-direction: column; gap: 6px; padding: 10px 8px; border-right: 1px solid var(--line); background: var(--sheet); }
.semtools .btn { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 6px 4px; }
.semtools .btn[aria-pressed="true"] { background: var(--accent); color: var(--sheet); border-color: var(--accent); }
.semcv { overflow: auto; background: var(--sheet); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 20px 20px; }
.semcv svg { display: block; touch-action: none; user-select: none; }
.semside { border-left: 1px solid var(--line); padding: 10px 12px; overflow: auto; background: var(--panel); font-size: 12.5px; }
.semside h5 { margin: 10px 0 6px; font-size: 13px; }
.semvars { display: flex; flex-wrap: wrap; gap: 4px; }
.semsize label { display: grid; grid-template-columns: 7.5em 1fr 3em; align-items: center; gap: 6px; margin: 4px 0; }
.semsize input[type=range] { width: 100%; accent-color: var(--accent); }
.semsize output { font-family: var(--f-num); font-size: 12px; text-align: right; }
.semsize .btn { margin-top: 4px; }
.pardlg { position: fixed; inset: 0; z-index: 1200; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
.pardlg[hidden] { display: none; }
.parbox { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; width: min(860px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.25); font-size: 13px; }
.parhead, .parfoot { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.parfoot { border-bottom: 0; border-top: 1px solid var(--line); }
.parscroll { overflow: auto; padding: 10px 14px; }
.parcard { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 10px 0; background: var(--sheet); }
.parhd { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.parfit { margin: 6px 0 2px; font-family: var(--f-num); font-size: 12px; }
.parwarn { margin: 4px 0; padding: 4px 8px; border-left: 3px solid var(--sig); background: color-mix(in srgb, var(--sig) 8%, transparent); font-size: 12px; }
.parnote { padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--accent-soft); margin-bottom: 8px; }
.partbl { overflow-x: auto; } .partbl table { border-collapse: collapse; margin: 6px 0; font-size: 12.5px; }
.partbl th, .partbl td { padding: 3px 10px; border-bottom: 1px solid var(--line); text-align: left; } .partbl .c { text-align: center; }
.partbl .parsum td { font-size: 11.5px; color: var(--muted); border-bottom: 0; }
.parprog { display: flex; gap: 8px; align-items: center; margin-top: 8px; } .parprog progress { flex: 1; }
.parres table { font-size: 12px; }
.semsize label.semchk { display: flex; gap: 6px; grid-template-columns: none; }
.semvars .chip[disabled] { opacity: .4; cursor: default; }
.semside textarea { width: 100%; font-family: var(--f-num); font-size: 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); color: var(--fg); padding: 6px; }
table.semfit td { padding: 2px 6px; white-space: normal; }
@media (max-width: 760px) { .sembody { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; } .semtools { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); } .semtools .btn { min-width: 70px; } .semside { border-left: 0; border-top: 1px solid var(--line); max-height: 34vh; } }
.viewtabs { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 8px; flex-wrap: wrap; }
.viewtabs button { font: inherit; font-size: 13px; border: 1px solid transparent; border-bottom: 0; background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 4px 4px 0 0; cursor: pointer; margin-bottom: -1px; }
.viewtabs button[aria-selected="true"] { color: var(--accent); font-weight: 600; background: var(--sheet); border-color: var(--line); border-bottom: 1px solid var(--sheet); }
.viewtabs label { display: flex; align-items: center; gap: 4px; } .viewtabs select { font: inherit; font-size: 12px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); color: var(--fg); }
table.sheet input.cell.miss { color: var(--muted); text-decoration: line-through; }
table.sheet input.cell[readonly] { color: var(--accent); }
table.vview td { vertical-align: middle; } table.vview input.vlab { width: 240px; border: 0; background: transparent; color: var(--fg); font: inherit; font-family: var(--f-ui); font-size: 12.5px; padding: 4px 6px; }
table.vview input.vmiss { width: 70px; border: 0; background: transparent; color: var(--fg); font: inherit; padding: 4px 6px; }
table.vview select { font: inherit; font-family: var(--f-ui); font-size: 12px; border: 0; background: transparent; color: var(--fg); padding: 3px; }
table.vview td.vsum { font-family: var(--f-ui); font-size: 12px; padding: 2px 6px; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } table.vview td.vsum .btn { padding: 1px 8px; font-size: 11.5px; }
details.pickbox { margin: 0 0 10px; padding: 6px 10px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 0 4px 4px 0; background: var(--panel); font-family: var(--f-ui); font-size: 12.5px; }
details.pickbox summary { cursor: pointer; } details.pickbox summary .hint { margin-left: 6px; } details.pickbox .sheettools { margin-top: 6px; }
.pkinfo { margin: 6px 0 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; } .pkform { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 6px 0 2px; }
.pkform select { font: inherit; border: 1px solid var(--line); border-radius: 3px; background: var(--sheet); color: var(--fg); padding: 2px 4px; margin-left: 4px; max-width: 220px; } .pkchecks { display: inline-flex; flex-wrap: wrap; gap: 2px 10px; } .pkchecks input { accent-color: var(--accent); }
.vvbox { padding: 8px 6px; font-family: var(--f-ui); font-size: 12.5px; } .vvbox table.out input { border: 1px solid var(--line); border-radius: 3px; background: var(--sheet); color: var(--fg); font: inherit; padding: 2px 6px; } .vvbox input.vcode { width: 70px; } .vvbox input.vlab { width: 220px; }
.interp { margin: 10px 0 14px; padding: 9px 12px 9px 14px; border-left: 3px solid var(--g3); background: var(--panel); border-radius: 0 4px 4px 0; font-size: 12.8px; line-height: 1.75; }
.interp > b { display: block; color: var(--g3); font-size: 12px; margin-bottom: 2px; } .interp p { margin: 2px 0; }
.mcguide { width: 100%; margin-top: 4px; font-size: 12.5px; } .mcguide summary { cursor: pointer; color: var(--accent); } .mcguide .tw { margin-top: 6px; } .mcguide table.out td, .mcguide table.out th { white-space: normal; vertical-align: top; text-align: left; font-family: var(--f-ui); }

const MC_ROWS = [

      <p>すべての組を比べる・分散や人数が大きく違う → <b>Games-Howell 法</b></p>
      <p>反復測定（対応あり）・ノンパラメトリック検定・生存曲線など → <b>Holm 法</b></p>
      <p>多数の検定をふるい分ける探索的な研究 → <b>Benjamini-Hochberg 法</b></p></div>
    ${table(['方法', '比べる組', '前提', '特徴', '使うべき場合'], MC_ROWS.map(r => r.map((v, i) => i ? v : `<b>${v}</b>`)))}

      <p>すべての組を比べる → <b>Steel-Dwass 法</b>（Tukey 法のノンパラメトリック版）、または <b>Dunn 法</b>（Kruskal-Wallis 検定の事後検定として最もよく使われる。全体の順位を使うので結果が一貫する）</p>

}
// list: [{ t, df, p（調整前の両側 p） }]、k: 比べる水準の数、ctx: { pooled: 誤差平均平方を使う比較か, games: Games-Howell を計算できるか }
function mcAdjust(list, k, ctx = {}) { // list の各要素は { i, j, t, df, p, vec? }。ctx: { pooled, games, V, order, what }

// Kruskal-Wallis 検定の多重比較

const GC = ['--g1', '--g2', '--g3', '--g4', '--g5', '--g6'].map(v => `var(${v})`);
function niceTicks(lo, hi, n = 5) {

  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];
  const dec = Math.max(0, 1 - Math.floor(Math.log10(step)));

}

  if (ylab) s += `<text x="12" y="${M.t - 8}">${esc(ylab)}</text>`;
  return s;
}

      const rows = S.pairs(c.length).map(([i, j]) => { const P = S.pearson(L.cols[i], L.cols[j]), Sp = S.spearman(L.cols[i], L.cols[j]), K = S.kendall(L.cols[i], L.cols[j]); return [`${esc(n[i])} × ${esc(n[j])}`, fmt(P.r), `[${fmt(P.ciL)}, ${fmt(P.ciU)}]`, pcell(P.p), fmt(Sp.rho), pcell(Sp.p), fmt(K.tau), pcell(K.p)]; });
      h += table(['組', 'Pearson r', '95%CI', 'p 値', 'Spearman ρ', 'p 値', 'Kendall τ<sub>b</sub>', 'p 値'], rows);
      if (c.length > 2) {
        h += '<h4>相関行列（Pearson r、右上は p 値）</h4>' + table(['', ...n.map(esc)], L.cols.map((a, i) => [esc(n[i]), ...L.cols.map((b, j) => { if (i === j) return '1'; const P = S.pearson(a, b); return i > j ? { v: fmt(P.r) + star(P.p), cls: P.p < .05 ? 'sig' : '' } : fp(P.p); })]));
      }
      h += '<p class="note">95%CI は Fisher の z 変換。Spearman・Kendall の p 値は正規近似（同順位補正あり）。</p>';
      h += interp(S.pairs(c.length).slice(0, 6).map(([i, j]) => { const P = S.pearson(L.cols[i], L.cols[j]), Sp = S.spearman(L.cols[i], L.cols[j]); return `${esc(n[i])} と ${esc(n[j])}：r = ${fmt(P.r, 2)} で、${P.r > 0 ? '一方が高いほどもう一方も高い（正の）' : '一方が高いほどもう一方は低い（負の）'}${rMag(P.r)}相関です${P.p < .05 ? `（有意、${pTxt(P.p)}）` : `が、有意ではありません（${pTxt(P.p)}）`}。${Math.abs(P.r - Sp.rho) > .15 ? `Spearman の ρ（${fmt(Sp.rho, 2)}）と大きく違うので、外れ値や曲線的な関係がないか散布図で確認してください。` : ''}`; }),
        '相関の目安は |r| が .1 で弱い、.3 で中程度、.5 で強い（Cohen, 1988）です。相関は「一緒に変化する」ことを示すだけで、どちらが原因かは分かりません。');
      const P0 = S.pearson(L.cols[0], L.cols[1]); h += apa('論文記載例', `${esc(n[0])}と${esc(n[1])}の間には、<i>r</i>(${L.n - 2}) = ${fmt(P0.r, 2)}, 95% CI [${fmt(P0.ciL, 2)}, ${fmt(P0.ciU, 2)}], ${apaP(P0.p)} の相関がありました。`);
      return { title: '相関係数', html: h };
    },
    reg() {
      const c = selCols(); need(c.length >= 2, 'X と Y の2列を選んでください（先頭が X、2番目が Y）。'); const L = listwise(c.slice(0, 2)); need(L.n >= 4, '空欄のない行が4行以上必要です。');
      const [x, y] = L.cols, R = S.regression(x, y), xn = c[0].name, yn = c[1].name;
      let h = `<p class="note">目的変数 Y = ${esc(yn)}、説明変数 X = ${esc(xn)}、n = ${L.n}。</p>`;
      h += table(['', '係数', 'SE', 't', 'p 値', '95%CI', '標準化 β'], [
        ['切片', fmt(R.a), fmt(R.sea), fmt(R.ta), pcell(R.pa), `[${fmt(R.aL)}, ${fmt(R.aU)}]`, ''],
        [esc(xn), fmt(R.b), fmt(R.seb), fmt(R.tb), pcell(R.pb), `[${fmt(R.bL)}, ${fmt(R.bU)}]`, fmt(R.beta)]]);
      h += table(['R²', '調整済み R²', '推定の標準誤差', 'F', '自由度', 'p 値'], [[fmt(R.r2), fmt(R.adjr2), fmt(R.se), fmt(R.F), `${R.df1}, ${R.df2}`, pcell(R.pF)]]);
      h += apa('回帰式', `${esc(yn)} = ${fmt(R.a, 3)} ${R.b >= 0 ? '+' : '−'} ${fmt(Math.abs(R.b), 3)} × ${esc(xn)}（<i>R</i>² = ${fmt(R.r2, 3)}, <i>F</i>(1, ${R.df2}) = ${fmt(R.F, 2)}, ${apaP(R.pF)}）`);
      h += interp(`傾き ${fmt(R.b, 3)} は、${esc(xn)}が 1 増えると${esc(yn)}が平均して ${fmt(Math.abs(R.b), 3)} ${R.b >= 0 ? '増える' : '減る'}ことを表します。${sigW(R.pb, `この傾きは有意（${pTxt(R.pb)}）で、0（関係なし）とは考えにくいといえます。`, `この傾きは有意ではありません（${pTxt(R.pb)}）。${NS_NOTE}`)}`,
        `R² = ${fmt(R.r2, 2)} は、${esc(yn)}のばらつきの ${fmt(R.r2 * 100, 1)}% が${esc(xn)}で説明できることを意味します。切片 ${fmt(R.a, 2)} は ${esc(xn)} = 0 のときの予測値です（0 がデータの範囲外なら、意味を解釈しなくてかまいません）。`);
      h += scatter(x, y, xn, yn, R);
      h += regDiag(y, [x], null).html;
      return { title: '単回帰分析', html: h };
    },
    scatter() { const c = selCols(); need(c.length >= 2, 'X と Y の2列を選んでください。'); const L = listwise(c.slice(0, 2)); need(L.n >= 2, '空欄のない行が2行以上必要です。'); return { title: `散布図（${c[0].name} × ${c[1].name}）`, html: scatter(L.cols[0], L.cols[1], c[0].name, c[1].name) }; }
  },
  table: {
    chi() {
      const t = state.table, M = t.cells.map(r => r.map(v => toNum(v)));
      need(M.every(r => r.every(v => isFinite(v) && v >= 0 && Number.isInteger(v))), '度数は 0 以上の整数で入れてください。');
      const T = S.chiTable(M); need(T.rs.every(v => v > 0) && T.cs.every(v => v > 0), '合計が 0 の行または列があります。');
      const rn = t.rowNames.map(esc), cn = t.colNames.map(esc);
      let h = '<h4>観測度数（括弧内は期待度数）</h4>' + table(['', ...cn, '計'], M.map((r, i) => [rn[i], ...r.map((o, j) => `${o} <span style="color:var(--muted)">(${fmt(T.E[i][j], 1)})</span>`), T.rs[i]]).concat([['計', ...T.cs, T.N]]));
      h += '<h4>調整済み残差</h4>' + table(['', ...cn], T.adj.map((r, i) => [rn[i], ...r.map(z => ({ v: fmt(z, 2), cls: Math.abs(z) > 1.96 ? 'sig hi' : '' }))]));
      h += '<p class="note">|残差| > 1.96 のセル（橙）は、期待より有意に多い（正）か少ない（負）ことを示します（5% 水準）。</p>';
      const rows = [['Pearson の χ² 検定', 'χ² = ' + fmt(T.chi), T.df, pcell(T.p)], ['尤度比 G 検定', 'G = ' + fmt(T.G), T.df, pcell(T.pG)]];
      if (T.yates) rows.push(['χ² 検定（Yates の補正）', 'χ² = ' + fmt(T.yates.chi), 1, pcell(T.yates.p)], ['Fisher の直接確率法（両側）', '', '', pcell(T.fisher.p)], ['McNemar 検定（対応がある場合）', 'χ² = ' + fmt(T.mcnemar.chi), 1, pcell(T.mcnemar.p)]);
      h += '<h4>検定</h4>' + table(['検定', '統計量', '自由度', 'p 値'], rows);
      const eff = [['Cramér の V', fmt(T.V)]];
      if (T.yates) eff.push(['φ 係数', fmt(T.phi)], ['オッズ比 [95%CI]', `${fmt(T.or.or)} [${fmt(T.or.L)}, ${fmt(T.or.U)}]${T.or.corrected ? '（0 セルのため各セル +0.5）' : ''}`], ['Yule の Q', fmt(T.yuleQ)]);
      if (T.kappa != null) eff.push(['Cohen の κ（一致度として読む場合）', fmt(T.kappa)]);
      h += '<h4>効果量・関連の指標</h4>' + table(['指標', '値'], eff);
      if (T.small) h += `<p class="warn">期待度数が 5 未満のセルが ${T.small} 個（全体の ${Math.round(T.small / (T.R * T.C) * 100)}%）あります。${T.yates ? 'Fisher の直接確率法の p 値を使ってください。' : '20% を超える場合はカテゴリの統合を検討してください。'}</p>`;
      const hiC = []; T.adj.forEach((r, i) => r.forEach((z, j) => { if (Math.abs(z) > 1.96) hiC.push(`${rn[i]}×${cn[j]}（${z > 0 ? '多い' : '少ない'}）`); }));
      const pUse = T.yates && T.small ? T.fisher.p : T.p;
      h += interp(sigW(pUse, `${T.yates && T.small ? 'Fisher の直接確率法' : 'χ² 検定'}は有意（${pTxt(pUse)}）で、「行と列は無関係（独立）」という仮説は棄却されます。つまり、行のグループによって列の割合が違います。`, `${T.yates && T.small ? 'Fisher の直接確率法' : 'χ² 検定'}は有意ではなく（${pTxt(pUse)}）、行と列に関連があるとはいえません。${NS_NOTE}`),
        hiC.length ? `調整済み残差が ±1.96 を超えたセル：${hiC.join('、')}。どこで偏りが生じているかは、このセルで判断します。` : '調整済み残差が ±1.96 を超えるセルはありません。',
        `Cramér の V = ${fmt(T.V, 2)} は関連の強さを表し、${T.V < .1 ? 'ごく弱い' : T.V < .3 ? '弱い' : T.V < .5 ? '中程度の' : '強い'}関連です（目安：.1 弱・.3 中・.5 強、2×2 表の場合）。`);
      h += apa('論文記載例', `χ²(${T.df}, <i>N</i> = ${T.N}) = ${fmt(T.chi, 2)}, ${apaP(T.p)}, Cramér の <i>V</i> = ${fmt(T.V, 2)}`);
      return { title: `分割表の検定（${T.R}×${T.C}）`, html: h };
    }
  }
};

// ===== 確率計算 =====
state.dist = state.dist || { d: 't', df1: 10, df2: 20, mode: 'stat', x: 2.0, p: 0.05, tail: 'two' };
function renderDist() {
  const D = state.dist;
  $('#sheetBody').innerHTML = `<div class="dist"><div class="distform">
    <label>分布<select id="dd" data-dist="d"><option value="z">標準正規分布</option><option value="t">t 分布</option><option value="chi">χ² 分布</option><option value="f">F 分布</option></select></label>
    <label id="lab1">自由度 1<input id="df1" type="number" min="1" step="1" value="${D.df1}"></label>
    <label id="lab2">自由度 2<input id="df2" type="number" min="1" step="1" value="${D.df2}"></label>
    <label>計算<select id="dmode"><option value="stat">統計量 → p 値</option><option value="p">p 値 → 臨界値</option></select></label>
    <label id="labx">統計量<input id="dx" type="number" step="any" value="${D.x}"></label>
    <label id="labp">確率 α<input id="dp" type="number" step="any" min="0" max="1" value="${D.p}"></label>
    <label id="labt">片側／両側<select id="dtail"><option value="two">両側</option><option value="up">上側</option></select></label>
  </div><div class="bigres" id="dres"></div><div id="dsvg"></div>
  <p class="hint">例: t(17) = 2.11 の両側 p 値、F(2, 27) の 5% 臨界値など、論文の数値の確認や授業での説明に使えます。</p></div>`;
  $('#dd').value = D.d; $('#dmode').value = D.mode; $('#dtail').value = D.tail;
  $('#sheetBody').querySelector('.distform').addEventListener('input', updateDist);
  updateDist();
}
function updateDist() {
  const D = state.dist; if (!$('#dd')) return;
  D.d = $('#dd').value; D.df1 = Math.max(1, +$('#df1').value || 1); D.df2 = Math.max(1, +$('#df2').value || 1); D.mode = $('#dmode').value; D.x = +$('#dx').value; D.p = +$('#dp').value; D.tail = $('#dtail').value; save();
  const sym = D.d === 'z' || D.d === 't';
  $('#lab1').hidden = D.d === 'z'; $('#lab2').hidden = D.d !== 'f'; $('#labt').hidden = !sym;
  $('#labx').hidden = D.mode !== 'stat'; $('#labp').hidden = D.mode !== 'p';
  const up = { z: x => S.pnU(x), t: x => S.ptU(x, D.df1), chi: x => S.pchiU(x, D.df1), f: x => S.pfU(x, D.df1, D.df2) }[D.d];
  const qup = { z: p => S.qn(p), t: p => S.qt(p, D.df1), chi: p => S.qchi(p, D.df1), f: p => S.qf(p, D.df1, D.df2) }[D.d];
  const pdf = { z: x => S.dnorm(x), t: x => Math.exp(S.lgamma((D.df1 + 1) / 2) - S.lgamma(D.df1 / 2) - .5 * Math.log(D.df1 * Math.PI) - (D.df1 + 1) / 2 * Math.log(1 + x * x / D.df1)),
    chi: x => x <= 0 ? 0 : Math.exp((D.df1 / 2 - 1) * Math.log(x) - x / 2 - D.df1 / 2 * Math.LN2 - S.lgamma(D.df1 / 2)),
    f: x => { if (x <= 0) return 0; const a = D.df1, b = D.df2; return Math.exp(.5 * (a * Math.log(a * x) + b * Math.log(b) - (a + b) * Math.log(a * x + b)) - Math.log(x) - (S.lgamma(a / 2) + S.lgamma(b / 2) - S.lgamma((a + b) / 2))); } }[D.d];
  const name = { z: 'z', t: `t(${D.df1})`, chi: `χ²(${D.df1})`, f: `F(${D.df1}, ${D.df2})` }[D.d];
  let cut, p, txt;
  if (D.mode === 'stat') {
    const x = D.x; if (!isFinite(x)) { $('#dres').textContent = '統計量を入れてください。'; return; }
    if (sym && D.tail === 'two') { p = 2 * up(Math.abs(x)); cut = Math.abs(x); } else { p = up(x); cut = x; }
    txt = `${name} = ${x} のとき <small>${sym ? (D.tail === 'two' ? '両側' : '上側') : '上側'}</small> p = ${p < 1e-4 ? p.toExponential(3) : p.toFixed(4)}`;
  } else {
    const a = D.p; if (!(a > 0 && a < 1)) { $('#dres').textContent = '確率は 0 と 1 の間で入れてください。'; return; }
    cut = sym && D.tail === 'two' ? qup(a / 2) : qup(a); p = a;
    txt = `${name} の ${sym ? (D.tail === 'two' ? '両側' : '上側') : '上側'} ${a * 100}% 臨界値 <small>＝</small> ${sym && D.tail === 'two' ? '±' : ''}${cut.toFixed(4)}`;
  }
  $('#dres').innerHTML = txt;
  // 図
  const W = 520, H = 220, M = { l: 20, r: 20, t: 16, b: 30 };
  let x0, x1; if (sym) { const lim = Math.max(4, Math.abs(cut) * 1.15); x0 = -lim; x1 = lim; } else { x0 = 0; x1 = Math.max(qup(0.001), cut * 1.15); }
  const N = 200, xs = Array.from({ length: N + 1 }, (_, i) => x0 + (x1 - x0) * i / N), ys = xs.map(pdf), ymax = Math.max(...ys.filter(isFinite).map(v => Math.min(v, 2))) * 1.08 || 1;
  const fx = x => M.l + (x - x0) / (x1 - x0) * (W - M.l - M.r), fy = y => H - M.b - Math.min(y, ymax) / ymax * (H - M.t - M.b);
  const area = (a, b) => { let s = `M${fx(a)},${fy(0)}`; for (let i = 0; i <= 80; i++) { const x = a + (b - a) * i / 80; s += `L${fx(x).toFixed(1)},${fy(pdf(x)).toFixed(1)}`; } return s + `L${fx(b)},${fy(0)}Z`; };
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><line x1="${M.l}" x2="${W - M.r}" y1="${fy(0)}" y2="${fy(0)}" stroke="var(--line)"/>`;
  if (cut < x1) s += `<path d="${area(Math.max(cut, x0), x1)}" fill="var(--sig)" fill-opacity=".35"/>`;
  if (sym && D.tail === 'two' && -cut > x0) s += `<path d="${area(x0, -cut)}" fill="var(--sig)" fill-opacity=".35"/>`;
  s += `<path d="${xs.map((x, i) => (i ? 'L' : 'M') + fx(x).toFixed(1) + ',' + fy(ys[i]).toFixed(1)).join('')}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  niceTicks(x0, x1, 8).filter(v => v >= x0 && v <= x1).forEach(v => s += `<text x="${fx(v)}" y="${H - M.b + 16}" text-anchor="middle">${+v.toPrecision(6)}</text>`);
  if (isFinite(cut) && cut <= x1) s += `<line x1="${fx(cut)}" x2="${fx(cut)}" y1="${M.t}" y2="${fy(0)}" stroke="var(--sig)" stroke-dasharray="4 3"/>`;
  $('#dsvg').innerHTML = s + `<text x="${W - M.r}" y="${M.t + 4}" text-anchor="end">塗りの面積 ＝ p</text></svg>`;
}

/*DB*/

function renderAll() { renderTabs(); renderSheet(); renderPanel(); }
renderAll();
// 起動時に例を1つ表示（例のデータによる結果）
if (state.fmt === 'indep') { try { addResult(ANALYSES.indep.multi(), true); } catch (e) { } }
</script>
