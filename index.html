<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ブラウザ統計ラボ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* レイアウト: 上にデータ形式タブ、左にデータシート、右に解析パネルと結果ツリー（スマホでは縦積み） */
:root {
  --bg: #eef1f0;          /* 方眼紙のようなわずかに緑がかったグレー */
  --sheet: #ffffff;
  --panel: #f7f9f8;
  --line: #cfd8d5;
  --grid: #e3e9e7;
  --fg: #1b2624;
  --muted: #5b6b67;
  --accent: #17607a;      /* ペトロールブルー */
  --accent-soft: #dcecf1;
  --sig: #a3480f;         /* 有意の印 */
  --sig-soft: #fbe9dc;
  --g1: #17607a; --g2: #c0612b; --g3: #5d7f2a; --g4: #7b4f9e; --g5: #b23a56; --g6: #3e7d78;
  --f-ui: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141b1a; --sheet: #1b2422; --panel: #18201f; --line: #33423f; --grid: #26312f; --fg: #e3ebe9; --muted: #95a6a2;
  --accent: #5fb6d3; --accent-soft: #1d3a44; --sig: #f0a06a; --sig-soft: #3d2718;
  --g1: #5fb6d3; --g2: #e8925c; --g3: #9cc25e; --g4: #b593d6; --g5: #e77894; --g6: #6fc2bb; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141b1a; --sheet: #1b2422; --panel: #18201f; --line: #33423f; --grid: #26312f; --fg: #e3ebe9; --muted: #95a6a2;
  --accent: #5fb6d3; --accent-soft: #1d3a44; --sig: #f0a06a; --sig-soft: #3d2718;
  --g1: #5fb6d3; --g2: #e8925c; --g3: #9cc25e; --g4: #b593d6; --g5: #e77894; --g6: #6fc2bb; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; line-height: 1.55; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
header.top h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
header.top h1 span { color: var(--accent); }
header.top p { margin: 0; color: var(--muted); font-size: 13px; }
nav.formats { display: flex; flex-wrap: wrap; gap: 6px; }
nav.formats button { font: inherit; border: 1px solid var(--line); background: var(--sheet); color: var(--fg); padding: 7px 12px; border-radius: 4px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 0; line-height: 1.3; }
nav.formats button small { color: var(--muted); font-size: 11px; }
nav.formats button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
nav.formats button[aria-selected="true"] small { color: var(--sheet); opacity: .85; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.main { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
section.box { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.box > .hd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.box > .hd h2 { font-size: 14px; margin: 0; margin-right: auto; }
.box > .bd { padding: 10px 12px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.btn { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 4px 10px; border-radius: 4px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--sheet); border-color: var(--accent); }
.btn.run { text-align: left; padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; }
.btn.run b { font-weight: 500; font-size: 13px; }
.btn.run span { color: var(--muted); font-size: 11.5px; }

/* データシート */
.sheetwrap { overflow: auto; max-height: 62vh; border: 1px solid var(--line); border-radius: 4px; }
table.sheet { border-collapse: collapse; font-family: var(--f-num); font-size: 13px; }
table.sheet th, table.sheet td { border: 1px solid var(--grid); padding: 0; }
table.sheet thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
table.sheet .rn { background: var(--panel); color: var(--muted); font-size: 11px; text-align: right; padding: 0 6px; min-width: 34px; position: sticky; left: 0; }
table.sheet input.cell { width: 88px; border: 0; background: transparent; color: var(--fg); font: inherit; padding: 4px 6px; text-align: right; }
table.sheet input.cell.bad { background: var(--sig-soft); }
table.sheet input.name { width: 88px; border: 0; background: transparent; color: var(--fg); font-family: var(--f-ui); font-weight: 500; font-size: 12.5px; padding: 4px 6px; }
table.sheet input.rname { width: 96px; text-align: left; font-family: var(--f-ui); }
table.sheet .colhd { display: flex; align-items: center; gap: 2px; padding-left: 4px; }
table.sheet .colhd input[type=checkbox] { accent-color: var(--accent); margin: 0; }
table.sheet .total { color: var(--muted); padding: 4px 6px; text-align: right; }
.sheettools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* 解析パネル */
.runs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.opts label { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; } .opts select { max-width: 100%; }
.opts input { accent-color: var(--accent); }
.msg { margin-top: 8px; font-size: 12.5px; color: var(--sig); min-height: 1em; }

/* 結果 */
.toc { display: flex; flex-wrap: wrap; gap: 4px; }
.toc a { font-size: 12px; color: var(--accent); text-decoration: none; border: 1px solid var(--line); padding: 2px 8px; border-radius: 10px; background: var(--panel); }
.results { display: flex; flex-direction: column; gap: 12px; }
article.res { border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); min-width: 0; scroll-margin-top: 12px; }
article.res > header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--grid); background: var(--panel); border-radius: 6px 6px 0 0; flex-wrap: wrap; }
article.res > header h3 { font-size: 13.5px; margin: 0; margin-right: auto; }
article.res > header .meta { color: var(--muted); font-size: 11.5px; font-family: var(--f-num); }
article.res .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.res h4 { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); font-weight: 500; letter-spacing: .03em; }
.tw { overflow-x: auto; }
table.out { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.out th, table.out td { padding: 3px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.out thead th { border-bottom: 1px solid var(--fg); font-weight: 500; text-align: right; color: var(--muted); }
table.out thead th:first-child { text-align: left; }
table.out td { text-align: right; font-family: var(--f-num); }
table.out td:first-child, table.out td.l { text-align: left; font-family: var(--f-ui); }
table.out tbody tr:last-child td { border-bottom: 1px solid var(--fg); }
td.sig { color: var(--sig); font-weight: 500; }
td.hi { background: var(--sig-soft); }
.apa { font-size: 12.5px; background: var(--accent-soft); border-radius: 4px; padding: 6px 10px; }
.apa b { font-weight: 500; color: var(--accent); margin-right: 6px; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.warn { font-size: 12px; color: var(--sig); margin: 0; }
svg.chart { width: 100%; max-width: 640px; height: auto; display: block; }
svg.chart text { font-family: var(--f-ui); font-size: 11px; fill: var(--muted); }
.empty { color: var(--muted); font-size: 13px; padding: 20px 4px; text-align: center; }

/* 確率計算 */
.dist { display: flex; flex-direction: column; gap: 12px; }
.distform { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.distform label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
.distform input, .distform select { font: inherit; font-family: var(--f-num); padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); color: var(--fg); width: 110px; }
.distform select { font-family: var(--f-ui); width: auto; }
.bigres { font-family: var(--f-num); font-size: 18px; }
.bigres small { font-family: var(--f-ui); font-size: 12px; color: var(--muted); }
/* データベース型・図 */
.tbadge { font-family: var(--f-ui); font-size: 10px; border-radius: 3px; padding: 0 4px; line-height: 16px; color: var(--sheet); background: var(--muted); }
.tbadge.num { background: var(--accent); } .tbadge.cat { background: var(--g2); }
.autoh { margin: 14px 0 6px; font-size: 13px; } .autoh span { font-weight: 400; color: var(--muted); font-size: 11.5px; margin-left: 6px; }
.auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.minifig { margin: 0; border: 1px solid var(--grid); border-radius: 4px; padding: 4px 6px; background: var(--panel); min-width: 0; }
.minifig figcaption { font-size: 12px; font-weight: 500; }
svg.mini { width: 100%; height: auto; display: block; } svg.mini text { font-family: var(--f-num); font-size: 9.5px; fill: var(--muted); }
.roles { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.roles label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
.roles select, .opts select { font: inherit; font-size: 13px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); color: var(--fg); }
.dual { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; margin-top: 8px; }
.dlcol { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet); overflow: hidden; }
.dlhead { padding: 6px 8px; font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; background: var(--panel); }
.dlhead small { font-weight: 400; color: var(--muted); }
.dlfilter { font: inherit; font-weight: 400; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); }
.dlist { height: 280px; overflow: auto; user-select: none; -webkit-user-select: none; }
.dli { padding: 5px 8px; border-bottom: 1px solid var(--grid); cursor: pointer; font-size: 12.5px; line-height: 1.35; }
.dli b { display: block; font-weight: 600; }
.dli span { display: block; color: var(--muted); font-size: 11.5px; }
.dli:hover { background: var(--accent-soft); }
.dli.on { background: var(--accent); color: #fff; }
.dli.on span { color: #fff; opacity: .9; }
.dual2 { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; margin-top: 6px; align-items: stretch; } .dual2 .dlbtns { justify-content: center; }
.corbox { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); } h4.corh { margin: 0 0 2px; font-size: 13px; } small.pp { color: var(--muted); font-size: 10.5px; }
@media (max-width: 640px) { .dual2 { grid-template-columns: 1fr !important; } .dual2 > * { grid-row: auto !important; grid-column: auto !important; } }
.dlbtns { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.dlbtns .btn { white-space: nowrap; padding: 4px 8px; }
.dlempty { padding: 14px 10px; color: var(--muted); font-size: 12px; }
@media (max-width: 640px) { .dual { grid-template-columns: 1fr; } .dlbtns { flex-direction: row; flex-wrap: wrap; } .dlist { height: 200px; } }
.chipset { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-top: 8px; font-size: 12.5px; }
.chipset > span { color: var(--muted); font-size: 12px; margin-right: 4px; }
details.cutlist { margin: 8px 0; font-size: 12.5px; } details.cutlist summary { cursor: pointer; color: var(--accent); margin-bottom: 6px; }
details.cutlist .tw { max-height: 320px; overflow: auto; }
.semfig { overflow-x: auto; } .semfig svg { min-width: 860px; width: 100%; height: auto; }
.semtoast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 80; background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 18px rgba(0,0,0,.18); padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; max-width: calc(100vw - 32px); flex-wrap: wrap; }
.semtoast[hidden] { display: none; } .semtoast progress { width: 180px; } .semtoast span { color: var(--muted); font-size: 12px; }
.semsum { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; font-size: 12.5px; color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.semthumb { margin-top: 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); padding: 6px; cursor: pointer; max-height: 260px; overflow: hidden; }
.semthumb svg { width: 100%; height: auto; max-height: 246px; pointer-events: none; }
.semed { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
.semed[hidden] { display: none; }
.semhd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--sheet); }
.semhd label { display: flex; align-items: center; gap: 4px; }
.sembody { flex: 1; display: grid; grid-template-columns: 112px 1fr 250px; min-height: 0; }
.semtools { display: flex; flex-direction: column; gap: 6px; padding: 10px 8px; border-right: 1px solid var(--line); background: var(--sheet); }
.semtools .btn { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; padding: 6px 4px; }
.semtools .btn[aria-pressed="true"] { background: var(--accent); color: var(--sheet); border-color: var(--accent); }
.semcv { overflow: auto; background: var(--sheet); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 20px 20px; }
.semcv svg { display: block; touch-action: none; user-select: none; }
.semside { border-left: 1px solid var(--line); padding: 10px 12px; overflow: auto; background: var(--panel); font-size: 12.5px; }
.semside h5 { margin: 10px 0 6px; font-size: 13px; }
.semvars { display: flex; flex-wrap: wrap; gap: 4px; }
.semsize label { display: grid; grid-template-columns: 7.5em 1fr 3em; align-items: center; gap: 6px; margin: 4px 0; }
.semsize input[type=range] { width: 100%; accent-color: var(--accent); }
.semsize output { font-family: var(--f-num); font-size: 12px; text-align: right; }
.semsize .btn { margin-top: 4px; }
.pardlg { position: fixed; inset: 0; z-index: 1200; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
.pardlg[hidden] { display: none; }
.parbox { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; width: min(860px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.25); font-size: 13px; }
.parhead, .parfoot { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.parfoot { border-bottom: 0; border-top: 1px solid var(--line); }
.parscroll { overflow: auto; padding: 10px 14px; }
.parcard { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 10px 0; background: var(--sheet); }
.parhd { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.parfit { margin: 6px 0 2px; font-family: var(--f-num); font-size: 12px; }
.parwarn { margin: 4px 0; padding: 4px 8px; border-left: 3px solid var(--sig); background: color-mix(in srgb, var(--sig) 8%, transparent); font-size: 12px; }
.parnote { padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--accent-soft); margin-bottom: 8px; }
.partbl { overflow-x: auto; } .partbl table { border-collapse: collapse; margin: 6px 0; font-size: 12.5px; }
.partbl th, .partbl td { padding: 3px 10px; border-bottom: 1px solid var(--line); text-align: left; } .partbl .c { text-align: center; }
.partbl .parsum td { font-size: 11.5px; color: var(--muted); border-bottom: 0; }
.parprog { display: flex; gap: 8px; align-items: center; margin-top: 8px; } .parprog progress { flex: 1; }
.parres table { font-size: 12px; }
.semsize label.semchk { display: flex; gap: 6px; grid-template-columns: none; }
.semvars .chip[disabled] { opacity: .4; cursor: default; }
.semside textarea { width: 100%; font-family: var(--f-num); font-size: 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); color: var(--fg); padding: 6px; }
table.semfit td { padding: 2px 6px; white-space: normal; }
@media (max-width: 760px) { .sembody { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; } .semtools { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); } .semtools .btn { min-width: 70px; } .semside { border-left: 0; border-top: 1px solid var(--line); max-height: 34vh; } }
.viewtabs { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 8px; flex-wrap: wrap; }
.viewtabs button { font: inherit; font-size: 13px; border: 1px solid transparent; border-bottom: 0; background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 4px 4px 0 0; cursor: pointer; margin-bottom: -1px; }
.viewtabs button[aria-selected="true"] { color: var(--accent); font-weight: 600; background: var(--sheet); border-color: var(--line); border-bottom: 1px solid var(--sheet); }
.viewtabs label { display: flex; align-items: center; gap: 4px; } .viewtabs select { font: inherit; font-size: 12px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--sheet); color: var(--fg); }
table.sheet input.cell.miss { color: var(--muted); text-decoration: line-through; }
table.sheet input.cell[readonly] { color: var(--accent); }
table.vview td { vertical-align: middle; } table.vview input.vlab { width: 240px; border: 0; background: transparent; color: var(--fg); font: inherit; font-family: var(--f-ui); font-size: 12.5px; padding: 4px 6px; }
table.vview input.vmiss { width: 70px; border: 0; background: transparent; color: var(--fg); font: inherit; padding: 4px 6px; }
table.vview select { font: inherit; font-family: var(--f-ui); font-size: 12px; border: 0; background: transparent; color: var(--fg); padding: 3px; }
table.vview td.vsum { font-family: var(--f-ui); font-size: 12px; padding: 2px 6px; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } table.vview td.vsum .btn { padding: 1px 8px; font-size: 11.5px; }
details.pickbox { margin: 0 0 10px; padding: 6px 10px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 0 4px 4px 0; background: var(--panel); font-family: var(--f-ui); font-size: 12.5px; }
details.pickbox summary { cursor: pointer; } details.pickbox summary .hint { margin-left: 6px; } details.pickbox .sheettools { margin-top: 6px; }
.pkinfo { margin: 6px 0 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; } .pkform { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 6px 0 2px; }
.pkform select { font: inherit; border: 1px solid var(--line); border-radius: 3px; background: var(--sheet); color: var(--fg); padding: 2px 4px; margin-left: 4px; max-width: 220px; } .pkchecks { display: inline-flex; flex-wrap: wrap; gap: 2px 10px; } .pkchecks input { accent-color: var(--accent); }
.vvbox { padding: 8px 6px; font-family: var(--f-ui); font-size: 12.5px; } .vvbox table.out input { border: 1px solid var(--line); border-radius: 3px; background: var(--sheet); color: var(--fg); font: inherit; padding: 2px 6px; } .vvbox input.vcode { width: 70px; } .vvbox input.vlab { width: 220px; }
.interp { margin: 10px 0 14px; padding: 9px 12px 9px 14px; border-left: 3px solid var(--g3); background: var(--panel); border-radius: 0 4px 4px 0; font-size: 12.8px; line-height: 1.75; }
.interp > b { display: block; color: var(--g3); font-size: 12px; margin-bottom: 2px; } .interp p { margin: 2px 0; }

const GC = ['--g1', '--g2', '--g3', '--g4', '--g5', '--g6'].map(v => `var(${v})`);
function niceTicks(lo, hi, n = 5) {

  const span = hi - lo, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0)), err = step0 / mag;
  const step = (err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];
  const dec = Math.max(0, 1 - Math.floor(Math.log10(step)));

}

  yt.forEach(v => { const y = fy(v); s += `<line x1="${M.l}" x2="${W - M.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${M.l - 6}" y="${y + 4}" text-anchor="end">${+v.toPrecision(6)}</text>`; });

  if (ylab) s += `<text x="12" y="${M.t - 8}">${esc(ylab)}</text>`;

}

  const fy = v => H - M.b - (v - yt[0]) / (yt[yt.length - 1] - yt[0]) * (H - M.t - M.b), bw = (W - M.l - M.r) / k;

    const bx = cx - w - 6;

    const m = S.mean(g); s += `<circle cx="${bx}" cy="${fy(m)}" r="3" fill="var(--sheet)" stroke="${c}" stroke-width="1.4"/>`;
    // 点列図（乱数振り分け打点）
    g.forEach(v => { const out = v < q1 - 1.5 * iqr || v > q3 + 1.5 * iqr; s += `<circle cx="${cx + 14 + R() * Math.min(28, bw * .25)}" cy="${fy(v)}" r="3.2" fill="${out ? 'var(--sig)' : c}" fill-opacity=".7"/>`; });

function histogram(g, name, ci) {

function descTable(cols, names) {
  return table(['変数', 'n', '平均', 'SD', 'SE', '95%CI 下限', '上限', '最小', 'Q1', '中央値', 'Q3', '最大', '歪度', '尖度'],

// ----- 図を画像としてコピー -----
const LIGHT = { '--bg': '#eef1f0', '--sheet': '#ffffff', '--panel': '#f7f9f8', '--line': '#cfd8d5', '--grid': '#e3e9e7', '--fg': '#1b2624', '--muted': '#5b6b67', '--accent': '#17607a', '--accent-soft': '#dcecf1', '--sig': '#a3480f', '--sig-soft': '#fbe9dc', '--g1': '#17607a', '--g2': '#c0612b', '--g3': '#5d7f2a', '--g4': '#7b4f9e', '--g5': '#b23a56', '--g6': '#3e7d78' };
function svgToPng(svg) {
  return new Promise((res, rej) => {
    const vb = svg.viewBox.baseVal, W = vb.width, H = vb.height, sc = 3;
    let s = new XMLSerializer().serializeToString(svg).replace(/var\((--[\w-]+)\)/g, (m, v) => LIGHT[v] || '#000');
    if (!/xmlns=/.test(s.slice(0, 300))) s = s.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    s = s.replace(/^<svg([^>]*)>/, (m, at) => `<svg${at.replace(/class="[^"]*"/, '')} width="${W}" height="${H}"><style>text{font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;font-size:11px;fill:${LIGHT['--muted']}}</style><rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>`);
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = W * sc; c.height = H * sc; const x = c.getContext('2d'); x.scale(sc, sc); x.drawImage(img, 0, 0, W, H); c.toBlob(b => b ? res(b) : rej(new Error('変換できませんでした')), 'image/png'); };
    img.onerror = () => rej(new Error('変換できませんでした'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  });
}
function decorateFigures(root) {
  root.querySelectorAll('svg.chart').forEach(svg => {
    if (svg.parentElement.classList.contains('fig')) return;
    const w = document.createElement('div'); w.className = 'fig'; svg.replaceWith(w); w.append(svg);
    w.insertAdjacentHTML('beforeend', '<div class="figbar"><button class="btn" data-fig="copy">図をコピー</button><button class="btn" data-fig="img">画像で表示</button></div>');
  });
}
async function figAction(btn) {
  const fig = btn.closest('.fig'), svg = fig.querySelector('svg.chart'), label = btn.textContent;
  const showImg = blob => { fig.querySelector('.figimg')?.remove(); const url = URL.createObjectURL(blob); fig.insertAdjacentHTML('beforeend', `<div class="figimg"><img src="${url}" alt="図の画像"><p class="note">画像を右クリック（スマホは長押し）すると、コピーや保存ができます。</p></div>`); };
  const p = svgToPng(svg);
  if (btn.dataset.fig === 'img') { try { showImg(await p); } catch (e) { btn.textContent = e.message; } return; }
  try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': p })]); btn.textContent = 'コピーしました（Word・PowerPoint に貼れます）'; }
  catch (e) { try { showImg(await p); btn.textContent = 'コピーできないため画像を表示しました'; } catch (e2) { btn.textContent = e2.message; } }
  setTimeout(() => btn.textContent = label, 2600);
}

  });

  s += `<text x="${W - M.r}" y="34" text-anchor="end">点＝調整済み平均、ひげ＝95%信頼区間</text>`;

// ===== 構造方程式モデリング：アイテム・パーセリング（項目をまとめて小包＝パーセルにする） =====

const PAR = { cfg: {}, seed: 1234, nAlloc: '100', job: null, msg: '', cfaCache: {} };
const PAR_METHODS = [['balance', '項目と構成概念のバランス法（推奨）'], ['random', '無作為'], ['oddeven', '奇数・偶数（項目の順に交互）'], ['manual', '手動（下位尺度などに合わせる）']];

// 潜在変数ごとの指標（潜在変数 → 観測変数 の矢印の先）

function parConf(m, lat) {

// パーセルに置き換えたモデル（m は変えずに複製を返す）。groups: { latId: [[項目…], …] }

// ----- パーセルを作る -----

    if (F) h += `<p class="note">1 因子 CFA（項目 ${items.length}、n = ${cf.n}）：${F.df > 0 ? `χ²(${F.df}) = ${fmt(F.chi, 2)}, ${apaP(F.pv)}, CFI = ${c2(F.cfi)}, TLI = ${c2(F.tli)}, RMSEA = ${c2(F.rmsea)}, SRMR = ${c2(F.srmr)}` : '自由度 0'}。標準化負荷：${items.map(it => `${esc(it)} ${c2(cf.load[it])}`).join('、')}。</p>`;

function parRcode(before, mm, info) {

  let s = rHeader('アイテム・パーセリング', ['lavaan']) + rDataFrame(J.map(j => state.db.cols[j].name), J.map(j => dbCol(j)));
  info.forEach(({ lat, items: its, groups }) => {
    s += `\n# ${lat.name}：1 因子 CFA で 1 次元性を確認\nfit1 <- lavaan::cfa('F1 =~ ${its.join(' + ')}', data = d)\nlavaan::fitMeasures(fit1, c("chisq", "df", "pvalue", "cfi", "tli", "rmsea", "srmr"))\nlavaan::standardizedSolution(fit1)[1:${its.length}, c("rhs", "est.std")]\n# パーセル（項目の平均）\n`;
    groups.forEach((g, p) => { s += `d$${RQ(parName(lat.name, p))} <- rowMeans(d[, c(${g.map(RS).join(', ')})], na.rm = TRUE)\n`; });
  });

  s += `\n# パーセルを指標にしたモデル\nmodel <- '\n${semSyntax(mm)}${auto.length ? '\n' + auto.join('\n') : ''}\n'\nfit <- lavaan::sem(model, data = d${mm.autoCov ? '' : ', auto.cov.lv.x = FALSE'})\nsummary(fit, fit.measures = TRUE, standardized = TRUE)\n`;

  return s;
}

// ----- 無作為配分のばらつき -----
function parAllocRun() {
  const m = state.db.semModel, { info } = parPlan(m), N = +PAR.nAlloc, R = rng(PAR.seed * 31 + 7);
  const cols = {}; info.forEach(({ items }) => items.forEach(it => { cols[it] = parColNum(it); }));
  const plan0 = {}; info.forEach(x => { plan0[x.lat.id] = x.groups; });
  const keyOf = e => e.type === 'A' ? `${e.from} → ${e.to}` : `${e.from} ↔ ${e.to}`;
  const isPN = name => info.some(x => x.groups.some((_, p) => parName(x.lat.name, p) === name));
  const pick = F => { const o = { CFI: F.cfi, TLI: F.tli, RMSEA: F.rmsea, SRMR: F.srmr, 'χ²': F.chi }; F.est.filter(e => (e.type === 'A' && e.role !== 'load') || (e.type === 'S' && e.i !== e.j && !isPN(e.from) && !isPN(e.to))).forEach(e => { o[keyOf(e)] = e.std; o['p:' + keyOf(e)] = e.p; }); return o; };
  const fitPlan = plan => { const mm = parModel(m, plan), extra = {}; Object.entries(plan).forEach(([lid, groups]) => { const L = m.nodes.find(n => n.id === lid); groups.forEach((g, p) => { extra[parName(L.name, p)] = cols[g[0]].map((_, i) => { const v = g.map(it => cols[it][i]).filter(isFinite); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : NaN; }); }); }); return parFit(mm, extra); };
  const ref = fitPlan(plan0); need(ref.conv, '今の割り当てで推定が収束しませんでした。');
  const res = [], job = PAR.job = { cancel: false }; let fail = 0, done = 0;
  const tick = () => {
    if (job.cancel) { PAR.job = null; PAR.msg = '<p class="hint">無作為配分の計算を中止しました。</p>'; parRender(); return; }
    const t0 = performance.now();
    while (done < N && performance.now() - t0 < 60) {
      const plan = {}; info.forEach(({ lat, items, c }) => { plan[lat.id] = parGroups(items, c.k, parAllocate(items, c.k, 'random', {}, R)); });
      try { const F = fitPlan(plan); if (F.conv && !F.heywood.length) res.push(pick(F)); else fail++; } catch (e) { fail++; }
      done++;
    }
    PAR.msg = `<div class="parprog"><b>無作為配分を推定中</b> ${done} / ${N}<progress max="${N}" value="${done}"></progress><button class="btn" data-par="cancel">中止</button></div>`; parRender();
    if (done < N) { setTimeout(tick, 0); return; }
    PAR.job = null; need(res.length >= 10, '多くの配分で推定が収束しませんでした。');
    const html = parAllocReport(info, pick(ref), res, N, fail);
    addResult({ title: `無作為配分のばらつき（${info.map(x => x.lat.name).join('・')}、${N} 通り）`, html, r: parRcode(m, parModel(m, plan0), info) }, true);
    PAR.msg = `<div class="parres"><h5>無作為配分のばらつき（${res.length} 通り）</h5>${html.split('<h4>')[1] ? '<h4>' + html.split('<h4>')[1].split('<div class="interp">')[0] : ''}<p class="hint">詳しい表は結果ツリーにも出しました。</p></div>`; parRender();
    const sc = $('#parDlg .parscroll'); if (sc) sc.scrollTop = sc.scrollHeight;
  };
  setTimeout(tick, 0);
}
function parAllocReport(info, ref, res, N, fail) {
  const q = (a, p) => { const s = a.slice().sort((x, y) => x - y), i = (s.length - 1) * p, lo = Math.floor(i); return s[lo] + (s[Math.ceil(i)] - s[lo]) * (i - lo); };
  const keys = Object.keys(ref).filter(k => !k.startsWith('p:'));
  const rows = keys.map(k => { const a = res.map(r => r[k]).filter(isFinite), P = res.map(r => r['p:' + k]).filter(isFinite), d = k === 'χ²' ? 2 : null, f = v => d ? fmt(v, d) : c2(v);
    return [esc(k), f(ref[k]), f(q(a, .5)), `${f(Math.min(...a))} 〜 ${f(Math.max(...a))}`, `[${f(q(a, .025))}, ${f(q(a, .975))}]`, P.length ? Math.round(P.filter(p => p < .05).length / P.length * 100) + '%' : '']; });
  let h = `<p class="note">各潜在変数の項目を、同じパーセル数のまま無作為に ${N} 通り配り直して推定しました（収束 ${res.length} 通り${fail ? `、収束しない・不適解の ${fail} 通りは除外` : ''}）。係数は標準化推定値です。</p>`;
  h += '<h4>配分による変動</h4>' + table(['指標・係数', '今の割り当て', '中央値', '最小 〜 最大', '95% の範囲', '有意（p < .05）の割合'], rows);
  const paths = keys.filter(k => k.includes('→') || k.includes('↔')), unstable = paths.filter(k => { const P = res.map(r => r['p:' + k]).filter(isFinite), s = P.filter(p => p < .05).length / (P.length || 1); return s > .05 && s < .95; });
  const cfi = res.map(r => r.CFI).filter(isFinite);
  h += interp(`無作為に分けると、どの項目が同じパーセルに入るかで結果が少し変わります。この表は、その揺れの大きさを示します（Sterba & MacCallum, 2010）。CFI は ${c2(Math.min(...cfi))} 〜 ${c2(Math.max(...cfi))} の範囲で動きました。`,
    unstable.length ? `<b>${unstable.map(esc).join('、')}</b> は、配分によって有意になったりならなかったりします。結論がパーセルの分け方に左右されるので、無作為の 1 回だけで判断せず、バランス法や内容に基づく割り当てを使い、この表もあわせて報告することを勧めます。` : (paths.length ? 'どのパスも、ほとんどの配分で有意かどうかの判断が変わりませんでした。結論はパーセルの分け方に左右されにくいといえます。' : ''),
    '「今の割り当て」は、ダイアログで選んでいる分け方（バランス法など）の結果です。中央値に近ければ、典型的な結果だといえます。');
  return h;
}

// ===== 回帰の診断・階層的重回帰分析・回帰平面の 3D プロット =====

// ---- 汎用の散布図（参照線・傾向線・点のラベルつき） ----
function diagPlot(x, y, o = {}) {
  const W = 400, H = 312, M = { l: 50, r: 14, t: o.title ? 42 : 26, b: 42 }, xs = [...x, ...(o.xExtra || [])], ys = [...y, ...(o.yExtra || [])];
  const xt = niceTicks(Math.min(...xs), Math.max(...xs), 5), yt = niceTicks(Math.min(...ys), Math.max(...ys), 5);
  const fx = v => M.l + (v - xt[0]) / (xt[xt.length - 1] - xt[0]) * (W - M.l - M.r), fy = v => H - M.b - (v - yt[0]) / (yt[yt.length - 1] - yt[0]) * (H - M.t - M.b);
  let s = frame(W, H, M, yt, o.yn || '', fy); const cid = 'dp' + (++clipN);
  s = s.replace(/^<svg[^>]*>/, `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><defs><clipPath id="${cid}"><rect x="${M.l}" y="${M.t}" width="${W - M.l - M.r}" height="${H - M.t - M.b}"/></clipPath></defs>`);
  xt.forEach(v => s += `<text x="${fx(v)}" y="${H - M.b + 15}" text-anchor="middle">${+v.toPrecision(5)}</text>`);
  s += `<text x="${W - M.r}" y="${H - 6}" text-anchor="end" style="fill:var(--fg)">${esc(o.xn || '')}</text>`;
  if (o.title) s += `<text x="${M.l}" y="14" style="fill:var(--fg);font-weight:600">${esc(o.title)}</text>`;
  (o.hlines || []).forEach(l => { if (l.y >= yt[0] && l.y <= yt[yt.length - 1]) s += `<line x1="${M.l}" x2="${W - M.r}" y1="${fy(l.y)}" y2="${fy(l.y)}" stroke="${l.col || 'var(--muted)'}" stroke-dasharray="${l.dash ? '4 3' : ''}"/>`; });
  (o.curves || []).forEach(c => s += `<polyline clip-path="url(#${cid})" points="${c.pts.map(([a, b]) => `${fx(a).toFixed(1)},${fy(b).toFixed(1)}`).join(' ')}" fill="none" stroke="${c.col || 'var(--sig)'}" stroke-width="1.3" stroke-dasharray="${c.dash ? '5 3' : ''}"/>`);
  x.forEach((v, i) => s += `<circle cx="${fx(v)}" cy="${fy(y[i])}" r="3.3" fill="${o.hi && o.hi.has(i) ? 'var(--sig)' : 'var(--accent)'}" fill-opacity=".7"/>`);
  if (o.trend && x.length >= 8) { // 移動平均の傾向線（曲がりの確認用）
    const idx = x.map((_, i) => i).sort((a, b) => x[a] - x[b]), w = Math.max(3, Math.round(x.length / 6)), pts = [];
    for (let k = 0; k < idx.length; k++) { const lo = Math.max(0, k - w), hi = Math.min(idx.length, k + w + 1), seg = idx.slice(lo, hi); pts.push([x[idx[k]], S.mean(seg.map(i => y[i]))]); }
    s += `<polyline clip-path="url(#${cid})" points="${pts.map(([a, b]) => `${fx(a).toFixed(1)},${fy(b).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--sig)" stroke-width="2"/>`;
  }
  Object.entries(o.labels || {}).forEach(([i, lab]) => s += `<text x="${fx(x[i]) + 5}" y="${fy(y[i]) - 5}" style="fill:var(--sig);font-size:10.5px">${esc(lab)}</text>`);
  return s + '</svg>';
}

// ---- 回帰の診断 ----

    + diagPlot(h, sr, { xn: 'てこ比（leverage）', yn: '標準化残差', title: '③ てこ比 対 残差（Cook の距離）', hlines: [{ y: 0 }], curves: [...[.5, 1].flatMap(D => [{ pts: curve(D), dash: 1 }, { pts: curve(D).map(([a, b]) => [a, -b]), dash: 1 }])], yExtra: [Math.min(...sr), Math.max(...sr)], labels, hi: hiSet })
    + '</div><p class="note">①：点が 0 の線の上下に偏りなく散らばり、赤い傾向線がほぼ水平なら「線形性」の前提は満たされています。曲がっていれば、2 乗の項や変数の変換を検討します。②：傾向線が水平なら残差のばらつきが一定（等分散性）、右上がり・右下がりなら不均一です。③：点線は Cook の距離 .5 と 1 の境界で、外側の点は結果に強い影響を与えるケースです。橙の点は Cook の距離 > 4/n、ラベルは影響の大きい上位 3 ケースです。</p>';
  out += table(['確認すること', '指標', '値', '判定'], [

    ['てこ比の大きいケース', `てこ比 > 2(p+1)/n（= ${fmt(cutH, 3)}）`, `${h.filter(v => v > cutH).length} ケース`, h.some(v => v > cutH) ? '確認を推奨' : 'なし']]);
  const fl = cook.map((c, i) => i).filter(i => flag[i]).sort((a, b) => cook[b] - cook[a]).slice(0, 10);
  if (fl.length) out += '<h4>確認したいケース（影響の大きい順、上位 10）</h4>' + table(['ケース', '実測値', '予測値', '標準化残差', 'スチューデント化残差', 'てこ比', 'Cook の距離'], fl.map(i => [lab(i), fmt(y[i], 2), fmt(fitted[i], 2), fmt(sr[i], 2), { v: fmt(rs[i], 2), cls: Math.abs(rs[i]) > 3 ? 'sig' : '' }, { v: fmt(h[i], 3), cls: h[i] > cutH ? 'sig' : '' }, { v: fmt(cook[i], 3), cls: cook[i] > cutC ? 'sig' : '' }]));

    dw > 1.5 && dw < 2.5 ? '' : `Durbin-Watson 比が ${fmt(dw, 2)} で、データの並び順に沿った残差の相関（自己相関）があるかもしれません。時系列データでなければ通常は問題になりません。`);
  return { html: out, h, cook, sr, BP, pBP, dw };
}

// ---- 3D プロット（ドラッグで回転） ----
const P3D = {};

function medModHelp() {
  return `<details class="guide mmhelp"><summary>媒介分析と調整分析の違い・使い方（はじめての人はここから）</summary>${conceptDiagrams()}
    <table class="out mmtab"><thead><tr><th></th><th>媒介分析</th><th>調整分析</th></tr></thead><tbody>
      <tr><td>問い</td><td>X は<b>なぜ・どのような道筋で</b> Y に影響するのか</td><td>X の影響は<b>いつ・誰で</b>強く（弱く）なるのか</td></tr>
      <tr><td>第3の変数</td><td>M（媒介変数）：X によって変わり、Y を変える</td><td>W（調整変数）：X とは別に人が持つ特徴や状況</td></tr>
      <tr><td>心理学の例</td><td>ストレス → 自尊感情の低下 → 抑うつ</td><td>ストレス → 抑うつ の影響が、サポートの多い人では弱い</td></tr>
      <tr><td>見る結果</td><td>間接効果 a×b とブートストラップ信頼区間</td><td>交互作用項 X×W、単純傾斜、Johnson-Neyman 法</td></tr>
      <tr><td>モデル（PROCESS）</td><td>モデル 4</td><td>モデル 1</td></tr></tbody></table>
    <p><b>調整媒介分析</b>は、2 つを組み合わせて「媒介の道筋（間接効果）の強さが W によって変わるか」を調べます。W がどの矢印を調整するかで、モデルを選びます。</p>
    <p>・<b>モデル 7</b>：W が X → M を調整（例：サポートが多い人では、ストレスがあっても自尊感情が下がりにくい）<br>・<b>モデル 14</b>：W が M → Y を調整（例：サポートが多い人では、自尊感情が低くても抑うつになりにくい）<br>・<b>モデル 8</b>：W が X → M と X → Y の直接効果の両方を調整</p>
    <p><b>系列媒介分析</b>は、媒介変数が<b>順番につながる</b>場合（X → M1 → M2 → Y）に使います。例：ストレス → 自尊感情の低下 → 反すう（くよくよ考える）の増加 → 抑うつ。M を 2〜3 個、影響が伝わる順にチェックして「系列媒介分析」を押します。並列媒介（媒介分析で M を複数選ぶ）とは、M どうしの影響（M1 → M2）を考えるかどうかが違います。例のデータでは、M に「自尊感情」→「反すう」の順でチェックすると体験できます。</p>
    <p>判定には<b>調整媒介指標</b>（ブートストラップ信頼区間が 0 を含まなければ調整媒介あり）と、W の値ごとの<b>条件付き間接効果</b>を使います。調整媒介分析は X・M・W・Y の 4 つを選び、上の「調整媒介のモデル」でモデルを選んでから実行します。</p>
    <p><b>使い方の手順</b></p>
    <p>① 研究の問いが「しくみ」なら媒介分析、「条件・個人差」なら調整分析を選びます。両方を組み合わせた「調整媒介」は、まず両方を別々に確かめてから考えます。</p>
    <p>② 上の欄で <b>X（原因）</b> と <b>Y（結果）</b> を選び、媒介分析なら <b>M</b>、調整分析なら <b>W</b> を選びます（性別や年齢など、統制したい変数は「共変量」に）。</p>
    <p>③ ボタンを押すと、結果の最初に「何がわかるか」の説明、パス図や単純傾斜の図、表、「読み方」、論文記載例が出ます。</p>
    <p>④ 試しに「例：媒介・調整データ」を押すと、X = ストレス、M = 自尊感情、W = サポート、Y = 抑うつ が入った状態で両方を体験できます。</p>
    <p class="note">どちらの分析も、変数の順序（何が原因で何が結果か）は統計ではなく<b>理論と研究デザイン</b>で決まります。1 回の調査データでの結果は「モデルと整合的」と控えめに解釈しましょう。</p></details>`;
}

function fastCoef(yv, colsv, idx) { // 正規方程式で係数だけを求める（ブートストラップ用）

  const k = o.mn.length, W = 680, H = k === 3 ? 360 : 300, bw = 124, bh = 38, X = { x: 80, y: H - 50 }, Y = { x: W - 80, y: H - 50 };
  const Ms = o.mn.map((_, i) => k === 2 ? { x: [230, 450][i], y: 95 } : [{ x: 160, y: 160 }, { x: 340, y: 40 }, { x: 520, y: 160 }][i]);

  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" style="max-width:680px"><defs><marker id="sra" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="var(--fg)"/></marker></defs>`;

  o.mn.forEach((_, i) => { s += edge(X, Ms[i], `a${i + 1} = ${lab(o.a[i], o.p.a[i])}`, o.p.a[i], i === 1 && k === 3 ? 12 : 0); s += edge(Ms[i], Y, `b${i + 1} = ${lab(o.b[i], o.p.b[i])}`, o.p.b[i], i === 1 && k === 3 ? -12 : 0); });

  return s + '</svg>';
}

// ---- 一般化線形モデル ----
function glmFit(y, cols, family) {
  const n = y.length, X = y.map((_, i) => [1, ...cols.map(c => c[i])]), p = X[0].length;

  for (let it = 0; it < 100; it++) {
    const w = mu.map(m => 1 / (link.d(m) ** 2 * link.v(m))), z = eta.map((e, i) => e + (y[i] - mu[i]) * link.d(mu[i]));
    const XtWX = Array.from({ length: p }, () => new Array(p).fill(0)), XtWz = new Array(p).fill(0);
    for (let i = 0; i < n; i++) for (let a = 0; a < p; a++) { XtWz[a] += X[i][a] * w[i] * z[i]; for (let c = 0; c < p; c++) XtWX[a][c] += X[i][a] * w[i] * X[i][c]; }
    inv = invM(XtWX); const nb = inv.map(r => S.sum(r.map((v, j) => v * XtWz[j]))), ch = Math.max(...nb.map((v, j) => Math.abs(v - b[j]))); b = nb;
    eta = X.map(r => S.sum(r.map((v, j) => v * b[j]))); mu = eta.map(link.inv).map(m => family === 'binomial' ? Math.min(1 - 1e-12, Math.max(1e-12, m)) : m);
    if (ch < 1e-10) break;
  }

// ===== 共通のデータ（データベース型と同じデータ）から、独立多群型・関連多群型・2変量型・分割表型のシートを作る =====
// 1 つのファイルを読み込めば、どのタブでも「使う列を選ぶ」だけで解析できるようにする。
const PICK_FMTS = ['indep', 'paired', 'bivar', 'table'];
function pickState() { state.opt.pick = state.opt.pick || {}; return state.opt.pick; }
function pickHasData() { return state.db && state.db.rows.some(r => r.some(v => String(v ?? '').trim() !== '')); }
function pickColsOf(type) { return state.db.cols.map((c, j) => ({ j, name: c.name || `列${j + 1}`, t: colType(j) })).filter(c => !type || c.t === type); }
function pickLevels(j) { return levelsOf(dbCol(j)); }
function pickIdx(name, fallback) { const j = state.db.cols.findIndex(c => c.name === name); return j >= 0 ? j : fallback; }
function pickGroupCols() { // 群の候補：文字の列（2〜20 水準）と、1・2 のように水準の少ない数値の列（2〜6 水準）
  return pickColsOf().filter(c => { if (c.t === 'empty' || pickIsId(c.j)) return false; const k = pickLevels(c.j).length; return k >= 2 && k <= (c.t === 'cat' ? 20 : 6); });
}
function pickIsId(j) { // ID・番号の列（測定値の初期値にしない）
  const c = state.db.cols[j]; if (/^(id|no\.?|番号|参加者|対象者|協力者)/i.test(String(c.name || '').trim())) return true;

}
// 選択の初期値：データベース型で決めた役割 → それがなければ先頭から
function pickDefaults() {
  const P = pickState(), R = state.db.roles || {}, num = pickColsOf('num').filter(c => !pickIsId(c.j)), grp = pickGroupCols(), cat = grp.filter(c => c.t === 'cat');
  const nm = j => j >= 0 && state.db.cols[j] ? state.db.cols[j].name : '';
  const isNum = j => num.some(c => c.j === j), isGrp = j => grp.some(c => c.j === j);
  const g0 = isGrp(R.a) ? R.a : (cat[0] || grp[0] || { j: -1 }).j;
  const y0 = isNum(R.y) && R.y !== g0 ? R.y : (num.find(c => c.j !== g0) || { j: -1 }).j;
  const rep = (R.rep || []).filter(isNum), fa = (R.fa || []).filter(isNum);

    indep: { y: nm(y0), g: nm(g0) },
    paired: { cols: (rep.length >= 2 ? rep : fa.length >= 2 ? fa : num.slice(0, Math.min(3, num.length)).map(c => c.j)).map(nm) },
    bivar: { x: nm((num[0] || { j: -1 }).j), y: nm((num[1] || { j: -1 }).j), more: [] },
    table: { r: nm(isGrp(R.a) ? R.a : (cat[0] || grp[0] || { j: -1 }).j), c: nm(isGrp(R.b) && R.b !== R.a ? R.b : (cat[1] || grp.find(c => c.j !== (cat[0] || grp[0] || {}).j) || { j: -1 }).j) }

  const ok = n => n === '' || state.db.cols.some(c => c.name === n);
  if (![P.indep.y, P.indep.g].every(ok)) P.indep = D.indep;
  if (!P.paired.cols.every(ok)) P.paired = D.paired;
  if (![P.bivar.x, P.bivar.y, ...(P.bivar.more || []), ...(P.bivar.list || [])].every(ok)) P.bivar = D.bivar;

// 選んだ列から、今のタブのシートを作る
function pickApply() {
  const P = pickDefaults(), J = n => state.db.cols.findIndex(c => c.name === n); let done = '';

    const y = J(P.indep.y), g = J(P.indep.g); if (y < 0 || g < 0) return say('測定値と群の列を選んでください。');
    if (y === g) return say('測定値と群には、別の列を選んでください。');
    const yv = rawCol(y), gv = dbCol(g), lv = levelsOf(gv), by = lv.map(L => yv.filter((v, i) => gv[i] === L && v !== '' && isFinite(toNum(v))));

    state.indep = { cols: lv.map(L => ({ name: String(L), on: true })), rows: Array.from({ length: n }, (_, i) => by.map(b => b[i] ?? '')) };
    ok(`${src}「${P.indep.y}」を「${P.indep.g}」で分けて並べました（${lv.map((L, k) => `${L} ${by[k].length} 人`).join('、')}）。解析パネルのボタンで、そのまま解析できます。`);

    if (new Set(js).size !== js.length) return say('同じ列が 2 回入っています。');

  const D = agData(true), X = D.C[0].map((_, i) => D.C.map(c => toNum(c[i]))), A = iccAll(X), ck = iccChosenKey(), ch = A.rows.find(r => r.key === ck);
  need(A.MSr > 0, '対象の間に評定のばらつきがないため、ICC を計算できません。');
  let h = guideBox('ICC（級内相関係数）とは', [['何がわかる？', '数値の評定（得点・評価点など）が、評定者のあいだでどれだけ一致しているかを表します。評定の違いのうち、<b>対象（人・作文など）の本当の違いによる部分の割合</b>と考えることができます。'], ['読み方', '1 に近いほど一致しています。.75 以上で良好、.90 以上で非常に良好（Koo & Li, 2016）。'], ['6 種類の ICC', 'モデル（一元・二元）、タイプ（絶対一致・一貫性）、単位（単一・平均）の組み合わせで値が変わります。下の「ICC の選び方」を見て、研究の目的に合うものを選びます。']]);
  h += `<p class="note">評定者：${D.names.map(esc).join('・')}、対象 n = ${D.n}${D.nMiss ? `（評定がそろっていない ${D.nMiss} 件を除外）` : ''}。選んだ ICC：${ICC_MODEL_L[state.opt.iccModel]}・${state.opt.iccModel === 'oneway' ? '' : (state.opt.iccType === 'agreement' ? '絶対一致・' : '一貫性・')}${state.opt.iccUnit === 'average' ? '評定者の平均' : '単一の評定者'} → <b>${ch.sf}</b>（McGraw & Wong の表記では ${ch.mw}）。</p>`;
  if (state.opt.iccModel === 'oneway' && state.opt.iccType === 'consistency') h += '<p class="warn">一元配置では「一貫性」は定義されないので、絶対一致として計算しています。</p>';
  h += '<h4>ICC（6 種類）</h4>' + table(['Shrout & Fleiss', 'McGraw & Wong', '種類', 'ICC', '95% 信頼区間', 'F', '自由度', 'p 値'], A.rows.map(r => { const b = r.key === ck, w = x => b ? `<b>${x}</b>` : x; return [w(r.sf), w(r.mw), w(r.d), w(fmt(r.c, 3)), w(`[${fmt(r.lo, 3)}, ${fmt(r.hi, 3)}]`), fmt(r.F, 2), `${r.d1}, ${+r.d2.toFixed(2)}`, pcell(r.p)]; }))
    + `<p class="note">太字が選んだ ICC です。値・信頼区間・F 検定は R の irr::icc と同じ計算です（psych::ICC の ICC1・ICC2・ICC3・ICC1k・ICC2k・ICC3k に対応）。二元配置の「変量」と「混合」は計算式が同じで、解釈（評定者を一般化するかどうか）が違います。F 検定は「ICC = 0」の検定です。</p>`;
  const cm = D.names.map((_, j) => S.mean(X.map(r => r[j]))), cs = D.names.map((_, j) => S.sd(X.map(r => r[j])));
  h += '<h4>評定者ごとの平均</h4>' + table(['評定者', '平均', 'SD'], D.names.map((nm, j) => [esc(nm), fmt(cm[j], 2), fmt(cs[j], 2)])) + `<p class="note">評定者のあいだの平均の違い（甘い・辛い）は、MS（評定者）＝ ${fmt(A.MSc, 3)} に表れます。「絶対一致」の ICC はこの違いを不一致として数えるため、「一貫性」の ICC より低くなります。</p>`;
  h += '<h4>図：対象 × 評定者</h4>' + raterProfile(X, D.names);
  let ba = null; if (D.k === 2) { ba = blandAltman(X.map(r => r[0]), X.map(r => r[1]), D.names[0], D.names[1]); h += '<h4>図：Bland-Altman プロット</h4>' + ba.svg + `<p class="note">平均の差 ${fmt(ba.md, 2)}（SD ${fmt(ba.sd, 2)}）、一致の限界（95%）は ${fmt(ba.lo, 2)} 〜 ${fmt(ba.hi, 2)} です。2 人の評定が、ふつうこの範囲内でずれるという意味です。</p>`; }
  h += agreeGuide(false);
  const r3 = A.rows.find(r => r.key === '3' + (ck.endsWith('k') ? 'k' : '')), r2 = A.rows.find(r => r.key === '2' + (ck.endsWith('k') ? 'k' : ''));
  h += interp(`${ch.sf} ＝ ${fmt(ch.c, 2)}（95% CI [${fmt(ch.lo, 2)}, ${fmt(ch.hi, 2)}]）で、信頼性は${agKoo(ch.c)}です（Koo & Li, 2016 の目安）。信頼区間の下限でも判断するのが慎重な読み方です。`,
    Math.abs(r2.c - r3.c) > .03 ? `絶対一致（${r2.sf} = ${fmt(r2.c, 2)}）が一貫性（${r3.sf} = ${fmt(r3.c, 2)}）より低いのは、評定者によって全体的に甘い・辛いの違いがあるためです（評定者ごとの平均を参照）。` : `絶対一致（${r2.sf} = ${fmt(r2.c, 2)}）と一貫性（${r3.sf} = ${fmt(r3.c, 2)}）がほぼ同じなので、評定者のあいだに系統的な甘い・辛いの違いはほとんどありません。`,
    '論文では、どの ICC を使ったか（モデル・タイプ・単位）を必ず書きます。「ICC = .85」だけでは、どの式で計算したかがわかりません。');
  h += apa('論文記載例', `${D.k} 名の評定者（${D.names.join('・')}）による ${D.n} 件の評定について、評定者間信頼性を級内相関係数（${state.opt.iccModel === 'oneway' ? '一元配置' : `二元配置${state.opt.iccModel === 'twoway-random' ? '変量' : '混合'}効果モデル`}、${state.opt.iccModel === 'oneway' ? '' : (state.opt.iccType === 'agreement' ? '絶対一致、' : '一貫性、')}${state.opt.iccUnit === 'average' ? '評定者の平均' : '単一の評定者'}）で検討した。${ch.sf} = ${fmt(ch.c, 2)}, 95% CI [${fmt(ch.lo, 2)}, ${fmt(ch.hi, 2)}] であり、信頼性は${agKoo(ch.c).replace(/（.*）/, '')}であった。`);
  return { title: `評定者間一致（ICC・${D.names.join('・')}）`, html: h };
};

const RQ = n => '`' + String(n).replace(/`/g, "'") + '`';           // R の変数名（バッククォート）
const RS = s => '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
const csvCell = v => { v = String(v ?? ''); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function rDataFrame(names, cols, obj = 'd') { // cols: 値（文字列）の配列の配列
  const n = Math.max(0, ...cols.map(c => c.length)), lines = [names.map(csvCell).join(',')];
  for (let i = 0; i < n; i++) lines.push(cols.map(c => csvCell(c[i] ?? '')).join(','));
  return `${obj} <- read.csv(text = r"---(\n${lines.join('\n')}\n)---", check.names = FALSE, na.strings = c("", "NA"), fileEncoding = "UTF-8")\n`;
}
function rHeader(title, pkgs) {
  const d = new Date(), ds = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  return `# ${title}\n# ブラウザ統計ラボが作成した R スクリプト（${ds}）。データはこのファイルに埋め込んであります。\n` + (pkgs.length ? `# 初めて使うパッケージは、先に次の 1 行を実行してください：\n# install.packages(c(${pkgs.map(RS).join(', ')}))\n` : '') + (pkgs.includes('psych') ? 'options(mc.cores = 1)   # psych の並列計算を止める（Mac の RStudio・R で fa.parallel などが「コアが結果を提供しませんでした」で止まるのを防ぐ）\n' : '') + '\n';

const P_ADJ = { holm: 'holm', bonferroni: 'bonferroni', hochberg: 'hochberg', bh: 'BH', none: 'none', sidak: 'holm' };
const EMM_ADJ = { tukey: 'tukey', scheffe: 'scheffe', holm: 'holm', bonferroni: 'bonferroni', sidak: 'sidak', hochberg: 'hochberg', bh: 'fdr', none: 'none', games: 'tukey', dunnett: 'dunnettx' };
function rMcOneWay(y, g, m = 'm', data = 'long', k = 3) {
  if (k < 3) return '# 2 群なので多重比較は必要ありません（分散分析の結果がそのまま 2 群の比較です）\n';
  const mc = state.opt.mc || 'tukey', ctlLast = state.opt.dunCtl === 'last';

    dunnett: `${ctlLast ? `${data}$${g} <- relevel(${data}$${g}, ref = tail(levels(${data}$${g}), 1))  # 対照群を最後の水準に\n${m} <- update(${m}, data = ${data})\n` : ''}summary(multcomp::glht(${m}, linfct = multcomp::mcp(${g} = "Dunnett")))  # 対照群 = 最初の水準`,

    lmAnova() { const R = state.db.roles, bj = R.b >= 0 && R.b !== R.a ? R.b : -1, cv = (R.cov || []).filter(j => ![R.y, R.a, bj].includes(j) && colType(j) === 'num'); const D = dbData([R.y, R.a, bj, ...cv]);

    glmFam() { const R = state.db.roles, cv = (R.cov || []).filter(j => ![R.y, R.a].includes(j) && colType(j) === 'num'); const D = dbData([R.y, R.a, ...cv]);
      const raw = dbCol(R.y), lvY = levelsOf(raw.filter(v => v !== '')), nums = raw.map(toNum); let fam = state.opt.family; if (fam === 'auto') fam = lvY.length === 2 ? 'binomial' : nums.filter(isFinite).every(v => v >= 0 && Number.isInteger(v)) ? 'poisson' : 'gaussian';

    _cl(title, body, hier) { const js = [...(state.db.roles.cl || [])].filter(j => colType(j) === 'num').sort((a, b) => a - b), D = dbData(js), K = CL_LAST && CL_LAST.k ? CL_LAST.k : (state.opt.clK === 'auto' ? 3 : +state.opt.clK);

function rScript(fmt, run) { const f = RCODE[fmt] && RCODE[fmt][run]; return f ? f() : null; }

// ===== 左の一覧から右の箱へ変数を移す部品（箱は複数可）と、相関係数（偏相関つき） =====
// DL2.html(id, spec) で描き、移動のたびに spec.set(boxKey, keys) → spec.rerender() を呼ぶ。
const DL2 = { reg: {}, sel: {} }; // reg: id → spec、sel: id → { side, keys:Set, last }
DL2.html = function (id, spec) {
  DL2.reg[id] = spec; const S0 = DL2.sel[id] || (DL2.sel[id] = { side: 'L', keys: new Set(), last: null });
  const used = new Set(spec.boxes.flatMap(b => spec.get(b.key))), byKey = new Map(spec.items.map(it => [String(it.key), it]));

const safeName = s => (s || '結果').replace(/[\\/:*?"<>|（）()、・ →×]+/g, '_').replace(/_+/g, '_').slice(0, 50);
async function doExport(kind, arts, btn) {
  const blocks = arts.map(extractBlocks), title = arts.length === 1 ? arts[0].dataset.title : `分析結果（${arts.length} 件）`, base = safeName(arts.length === 1 ? title : '分析結果まとめ');
  const say = t => { if (btn) { const o = btn.dataset.label || btn.textContent; btn.dataset.label = o; btn.textContent = t; setTimeout(() => btn.textContent = o, 3200); } };
  try {
    if (kind === 'apacopy') { const r = await copyRich(apaHtml(blocks, { figures: false, titles: arts.length > 1 }), toMarkdown(blocks)); say(r === 'ok' ? 'コピーしました。Word に貼り付けてください' : '表示された内容を ⌘C でコピーしてください'); return; }
    if (kind === 'md') { const t = toMarkdown(blocks), r = await copyRich(`<pre style="white-space:pre-wrap;font-family:monospace;font-size:12px">${esc(t)}</pre>`, t); say(r === 'ok' ? 'Markdown をコピーしました' : '表示された内容を ⌘C でコピーしてください'); return; }
    if (kind === 'mdfile') { await saveFile(base + '.md', toMarkdown(blocks)); say('保存しました'); return; }
    if (kind === 'html') { await saveFile(base + '.html', apaHtmlDocument(blocks, title)); say('保存しました'); return; }
    if (kind === 'xlsx') { await saveFile(base + '.xlsx', buildXlsx(blocks)); say('保存しました'); return; }
    if (kind === 'docx') { say('作成中…'); await saveFile(base + '.docx', await buildDocx(blocks, title)); say('保存しました'); return; }
  } catch (err) { say(err && err.code === 'declined' ? '保存をやめました' : err && err.code === 'rate_limited' ? '少し待ってからもう一度' : '失敗しました：' + (err && (err.message || err.code) || '')); }
}
const EXPORT_MENU = `<div class="expmenu" hidden><p class="hint" style="margin:0 0 6px">APA 第 7 版の体裁（横罫線 3 本・縦罫線なし・表番号は太字・表題は斜体）で出力します。</p>
  <button class="btn primary" data-exp="apacopy">APA 形式でコピー（Word に貼り付け）<small>おすすめ</small></button>
  <button class="btn" data-exp="docx">Word ファイル（.docx）<small>表・図・論文記載例</small></button>
  <button class="btn" data-exp="xlsx">Excel ファイル（.xlsx）<small>数値を加工したいとき</small></button>
  <button class="btn" data-exp="html">HTML ファイル<small>印刷・PDF・Google ドキュメントへ</small></button>
  <button class="btn" data-exp="md">Markdown でコピー<small>Quarto・R Markdown・Notion 用</small></button></div>`;
document.addEventListener('click', e => {
  const t = e.target.closest('[data-expshow]'); if (t) { const m = (t.closest('article.res') || t.closest('.box')).querySelector('.expmenu'); if (m) m.hidden = !m.hidden; return; }
  const b = e.target.closest('[data-exp]'); if (!b) return; const art = b.closest('article.res');
  doExport(b.dataset.exp, art ? [art] : [...document.querySelectorAll('article.res')].reverse(), b);
});


function renderAll() { renderTabs(); renderSheet(); renderPanel(); }
renderAll();
// 起動時に例を1つ表示（例のデータによる結果）
if (state.fmt === 'indep') { try { addResult(ANALYSES.indep.multi(), true); } catch (e) { } }
